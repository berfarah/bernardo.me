<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Description }}">
<meta name="author" content="{{ .Site.Params.author }}">
<link href="{{ .Site.BaseURL }}/favicon.ico" rel="icon" type="image/ico" />

<link rel="preload" href="/fonts/Newsreader-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/30A4F8_D_0.woff2" as="font" type="font/woff2" crossorigin>

{{ $css := resources.Get "scss/main.scss" | css.Sass }}
{{ if hugo.IsProduction }}{{ $css = $css | minify | fingerprint "md5" }}{{ end }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" as="style" />

<link rel="preconnect" href="//hello.myfonts.net">
<link rel="stylesheet" href="//hello.myfonts.net/count/30a4f8" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="//hello.myfonts.net/count/30a4f8"></noscript>

<link rel="preconnect" href="https://www.googletagmanager.com">
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ .Site.Params.googleid }}');
  window.addEventListener('load', function() {
    var s = document.createElement('script');
    s.src = 'https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.googleid }}';
    document.head.appendChild(s);
  });
</script>
<script>if(!document.referrer||!document.referrer.startsWith(location.origin))document.documentElement.classList.add('first-visit')</script>
